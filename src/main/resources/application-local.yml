# Local Development Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: BillingServiceHikariPool-Local

  jpa:
    show-sql: true

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_billing_local}
  
  cache:
    redis:
      key-prefix: "iqscaffold:billing:local"
      enable-statistics: true
  
  email:
    smtp:
      port: ${SMTP_PORT:1025}
      username: ""
      password: ""
      auth: false
      starttls: false

  billing:
    payment:
      stripe:
        api-key: ${STRIPE_API_KEY:sk_test_dummy}
        webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}
        client-id: ${STRIPE_CLIENT_ID:ca_test_dummy}
    stripe:
      public-key: ${STRIPE_PUBLIC_KEY:pk_test_dummy}
      secret-key: ${STRIPE_SECRET_KEY:sk_test_dummy}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}
      connect-client-id: ${STRIPE_CONNECT_CLIENT_ID:ca_test_dummy}

logging:
  level:
    org.hibernate.SQL: DEBUG
