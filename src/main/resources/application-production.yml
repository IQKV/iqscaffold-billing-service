spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: BillingServiceHikariPool-Production

iqscaffold:
  liquibase:
    # Exclude demo context to prevent demo data in production
    contexts: "!demo"

logging:
  level:
    root: WARN
    com.iqscaffold.billingservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    liquibase: WARN
