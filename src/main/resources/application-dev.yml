# Development Profile Configuration
# This profile enables demo data for development and enhanced logging

iqscaffold:
  liquibase:
    contexts: "demo"

logging:
  level:
    # Application logging
    com.iqscaffold.billingservice: DEBUG
    com.iqscaffold.billingservice.tenancy.TenantLiquibaseRunner: DEBUG
    
    # Spring Framework
    org.springframework.web: INFO
    org.springframework.security: INFO
    
    # Database and JPA
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
    # Payment providers
    com.stripe: DEBUG
    
    # Infrastructure
    liquibase: INFO
    com.zaxxer.hikari: INFO
