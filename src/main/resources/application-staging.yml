# Staging Environment Configuration
#
# Logging Configuration (via environment variables):
# LOG_LEVEL_ROOT=INFO
# LOG_LEVEL_APP=INFO
# LOG_LEVEL_SPRING=WARN
# LOG_LEVEL_SECURITY=INFO
# LOG_LEVEL_SQL=WARN
# LOG_LEVEL_HIKARI=WARN
# LOG_LEVEL_MESSAGING=WARN
# LOG_LEVEL_STRIPE=INFO
# LOG_LEVEL_PAYMENT=INFO
# LOG_LEVEL_BILLING=INFO
# LOG_FORMAT=JSON

spring:
  datasource:
    hikari:
      pool-name: BillingServiceHikariPool-Staging

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://staging-db:5432/iqscaffold_billing_staging}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:redis-staging}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 16
        min-idle: 2
      key-prefix: "iqscaffold:billing:staging"
      default-ttl: PT30M
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:rabbitmq-staging}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
